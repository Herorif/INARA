name: Lean core and desktop build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  milestone:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest tests/test_conversation_service.py tests/test_legacy_runtime_smoke.py tests/test_durable_storage.py tests/test_resource_policy.py tests/test_native_resident.py tests/test_cad_jobs.py tests/test_scene_jobs.py tests/test_image_jobs.py -q
      - run: python -m ruff check backend/services backend/creative backend/workers backend/resident backend/resident_main.py scripts/verify-native.py scripts/verify-cad.py scripts/verify-images.py scripts/verify-vision.py tests/image_support.py tests/fixtures/image_worker.py backend/core/durable_reminders.py backend/core/reminder_store.py tests/test_conversation_service.py tests/test_durable_storage.py tests/test_resource_policy.py tests/test_native_resident.py tests/test_cad_jobs.py tests/test_scene_jobs.py tests/test_image_jobs.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/test_reminder_ui.mjs tests/test_capture.mjs tests/test_resident.cjs tests/test_cad_ui.mjs tests/test_vision.mjs
      - run: npm run build

      - name: Install Electron for hidden renderer checks
        run: |
          $env:ELECTRON_SKIP_BINARY_DOWNLOAD = $null
          node node_modules/electron/install.js
      - name: Verify workspace rendering
        run: |
          $env:ELECTRON_RUN_AS_NODE = $null
          $qaProcess = Start-Process node_modules/electron/dist/electron.exe -ArgumentList scripts/verify-workspace.cjs -WindowStyle Hidden -Wait -PassThru
          exit $qaProcess.ExitCode
      - name: Verify native host lifecycle and failure recovery
        run: python scripts/verify-native.py --idle-seconds 10 --failure-recovery
      - name: Verify offline CAD and resource recovery
        run: python scripts/verify-cad.py

      - name: Verify image workspace and resource recovery (labelled fixture, no model)
        run: python scripts/verify-images.py

      - name: Verify Vision studio (synthetic capture, real local worker)
        run: python scripts/verify-vision.py
