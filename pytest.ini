[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers
markers =
    live_api: calls a real paid AI provider API (and may run model-written code); skipped unless JARVIS_LIVE_API_TESTS=1
    live_hardware: talks to real devices on the local network (Kasa plugs, 3D printers); skipped unless JARVIS_LIVE_HARDWARE_TESTS=1
    live_blender: runs the local Blender 5.2 install on a tiny scene; skipped unless JARVIS_LIVE_BLENDER_TESTS=1
    live_wake: runs the real "Hey Jarvis" models on Windows text-to-speech clips; skipped unless JARVIS_LIVE_WAKE_TESTS=1
