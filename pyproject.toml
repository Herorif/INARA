# Not an installable package: this table only records the supported interpreter
# range (CI and packaging use 3.12; 3.13 works for development). Ruff's
# target-version below stays pinned to the oldest supported version.
[project]
name = "jarvis"
version = "1.0.0"
requires-python = ">=3.12,<3.14"

[tool.ruff]
target-version = "py312"
line-length = 100
# Lint all first-party Python by default: new files under these trees are covered
# automatically. Ruff also honours .gitignore (.venv, .runtime, __pycache__).
include = ["backend/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
extend-exclude = [
    # Hand-run developer utilities (see scripts/manual/README.md): outside the runtime,
    # CI and packaging, and written against the retired CadAgent script layout.
    "scripts/manual",
]

[tool.ruff.lint]
# Correctness-only rule sets; no style or formatting rules.
select = [
    "E4", "E7", "E9", "F",  # pycodestyle errors that are bugs + pyflakes
    "B",          # flake8-bugbear: likely bugs and design problems
    "ASYNC",      # flake8-async: blocking calls and misuse in async code
    "PLE",        # pylint errors
    "RUF006",     # dangling asyncio tasks (no reference kept)
    "RUF018",     # assignment expression inside assert (vanishes under -O)
    "RUF024",     # dict.fromkeys with a shared mutable value
    "RUF026",     # defaultdict(default_factory=...) keyword misuse
    "RUF030",     # print() as an assert message
    "RUF034",     # if/else expression with identical branches
    "RUF040",     # assert message that is a non-string literal
    "RUF043",     # pytest.raises(match=) pattern with unescaped regex metacharacters
    "RUF100",     # noqa directives that no longer suppress anything
    "PGH004",     # blanket noqa (every suppression must name its code)
    "T10",        # leftover debugger calls/imports
    "YTT",        # sys.version / sys.version_info misuse
    "LOG",        # logging misuse (wrong logger construction, exception() outside except)
    "PIE794",     # class field defined twice (the first silently disappears)
    "PIE796",     # duplicate Enum values (silently aliased)
    # Pylint warnings that are outright mistakes (not style):
    "PLW0120",    # else on a loop without break
    "PLW0127",    # self-assignment
    "PLW0129",    # assert on a non-empty string literal (always true)
    "PLW0131",    # walrus without a context
    "PLW0177",    # comparison with NaN
    "PLW0245",    # super without parentheses
    "PLW0406",    # module imports itself
    "PLW0642",    # reassigning self/cls
    "PLW0711",    # except (A or B) catches only A
    "PLW1501",    # invalid open() mode
    "PLW1507",    # copy.copy(os.environ) is not a copy
    "PLW1508",    # os.getenv default that is not a string
    "PLW1509",    # subprocess preexec_fn (unsafe with threads)
]
ignore = [
    # ASYNC109: trio-style advice to replace `timeout=` parameters with cancel scopes.
    # Here those parameters are deliberate asyncio deadlines passed to wait_for/wait,
    # not a bug, and changing them would change public signatures.
    "ASYNC109",
    # ASYNC240: flags every pathlib/os.path metadata call (resolve, is_file, exists)
    # in async code. These are microsecond local-disk checks used as containment guards
    # right before acting on the path; offloading them buys nothing and only adds noise.
    # Real blocking file reads/writes stay covered by ASYNC230.
    "ASYNC240",
]
